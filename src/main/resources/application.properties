# SWIM DNOTAM Provider Validator (formerly swim-dnotam-mockclient)

quarkus.application.name=swim-dnotam-provider-validator
quarkus.http.port=${QUARKUS_HTTP_PORT:8080}

quarkus.index-dependency.validator-core.group-id=com.github.swim-developer
quarkus.index-dependency.validator-core.artifact-id=swim-validator-core
quarkus.index-dependency.validator-provider.group-id=com.github.swim-developer
quarkus.index-dependency.validator-provider.artifact-id=swim-validator-provider

# Native Image SSL Support (required for mTLS in native builds)
quarkus.ssl.native=true

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.github.swim_developer".level=DEBUG

# Event Generator (for simulating provider events)
event.generator.schedule=${EVENT_GENERATOR_SCHEDULE:0 */1 * * * ?}

# Keycloak Configuration
keycloak.url=${KEYCLOAK_URL:https://rhbk.apps.ocp4.masales.cloud}
keycloak.realm=${KEYCLOAK_REALM:swim}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:swim-public-client}

# SWIM Provider API (comma-separated list)
swim.provider.api.urls=${SWIM_PROVIDER_API_URLS:https://swim-dnotam-provider-mtls-swim-sandbox.apps.ocp4.masales.cloud}

# mTLS Configuration for Backend Proxy (if paths are configured, mTLS is used)
proxy.mtls.keystore.path=${PROXY_MTLS_KEYSTORE_PATH:certs/keystore.p12}
proxy.mtls.keystore.password=${PROXY_MTLS_KEYSTORE_PASSWORD:changeit}
proxy.mtls.keystore.type=${PROXY_MTLS_KEYSTORE_TYPE:PKCS12}
proxy.mtls.truststore.path=${PROXY_MTLS_TRUSTSTORE_PATH:certs/truststore.p12}
proxy.mtls.truststore.password=${PROXY_MTLS_TRUSTSTORE_PASSWORD:changeit}
proxy.mtls.truststore.type=${PROXY_MTLS_TRUSTSTORE_TYPE:PKCS12}

# MariaDB Database
quarkus.datasource.db-kind=mariadb
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10

# Production Database Configuration
%prod.quarkus.datasource.jdbc.url=jdbc:mariadb://${MARIADB_HOST:localhost}:${MARIADB_PORT:3306}/${MARIADB_DATABASE:swim_client}
%prod.quarkus.datasource.username=${MARIADB_USERNAME:swim}
%prod.quarkus.datasource.password=${MARIADB_PASSWORD:swim}

# AMQP Broker Configuration (infrastructure defaults only, credentials from UI)
swim.provider.amqp.host=${SWIM_PROVIDER_AMQP_HOST:provider-artemis-swim-sandbox.apps.ocp4.masales.cloud}
swim.provider.amqp.port=${SWIM_PROVIDER_AMQP_PORT:443}

## Development Configuration (compose.yml infrastructure)
%dev.quarkus.http.port=8085
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.datasource.jdbc.url=jdbc:mariadb://localhost:3308/swim_provider_validator
%dev.quarkus.datasource.username=swim
%dev.quarkus.datasource.password=swim
%dev.keycloak.url=https://keycloak.swim.lab:8543
%dev.swim.provider.api.urls=https://localhost:8443
%dev.swim.provider.amqp.host=localhost
%dev.swim.provider.amqp.port=5671

## Test Configuration (Dev Services auto-provisions MariaDB)
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.db-name=swim_provider_validator_test
%test.quarkus.datasource.devservices.username=swim
%test.quarkus.datasource.devservices.password=swim